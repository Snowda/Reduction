# Release Readiness controls for Reduction.
project = "Reduction"
schema = 1

[[control]]
id = "Reduction::default.pulumi"
title = "No Pulumi infrastructure in this repo"
assertion = "Reduction is a library embedded by other services; it owns no infrastructure, so the Pulumi presence check is opted out."
theme = "other"
gate = "advisory"
severity = "low"
evidence = ["repo override"]

[control.check]
kind = "pulumi"
policy = "off"

[[control]]
id = "Reduction::default.openapi"
title = "No OpenAPI spec in this repo"
assertion = "Reduction is a library embedded by other services and exposes no HTTP API of its own; the OpenAPI presence check is opted out."
theme = "other"
gate = "advisory"
severity = "low"
evidence = ["repo override"]

[control.check]
kind = "openapi"
policy = "off"
